<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Jakub Vyhnalik — e-commerce, vlastní značka, spolupráce." />
  <title>Jakub Vyhnalik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #E8C97A;
      --gold-dim: rgba(232,201,122,0.10);
      --gold-border: rgba(232,201,122,0.22);
      --bg: #0f0f0f;
      --bg-card: #141414;
      --bg-lift: #1a1a1a;
      --w100: #ffffff;
      --w80: rgba(255,255,255,0.80);
      --w60: rgba(255,255,255,0.60);
      --w40: rgba(255,255,255,0.40);
      --w20: rgba(255,255,255,0.20);
      --w10: rgba(255,255,255,0.10);
      --w06: rgba(255,255,255,0.06);
      --w04: rgba(255,255,255,0.04);
      --sans: 'Inter', sans-serif;
      --body: 'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--w100);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 20px 80px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(var(--gold) 0deg, rgba(232,201,122,0.2) 200deg, var(--gold) 360deg);
      margin-bottom: 18px;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-lift);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sans);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--gold);
      overflow: hidden;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      transform: scale(1.5) translateY(5%);
    }

    .name {
      font-family: var(--sans);
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.03em;
      color: var(--w100);
      margin-bottom: 6px;
      text-align: center;
    }

    .tagline {
      font-size: 14px;
      color: var(--w60);
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 32px;
      font-weight: 300;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 36px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg-card);
      border: 0.5px solid var(--w10);
      border-radius: 14px;
      padding: 16px 20px;
      text-decoration: none;
      transition: border-color 0.22s, background 0.22s, transform 0.15s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,201,122,0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.22s;
      pointer-events: none;
    }

    .link-card:hover {
      border-color: var(--gold-border);
      background: #181818;
      transform: translateY(-2px);
      text-decoration: none;
    }

    .link-card:hover::before { opacity: 1; }
    .link-card:active { transform: translateY(0); }

    .link-card.featured {
      border-color: var(--gold-border);
      background: rgba(232,201,122,0.05);
    }

    .link-card.featured .link-title { color: var(--gold); }

    .link-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--bg-lift);
      border: 0.5px solid var(--w10);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.22s, border-color 0.22s;
    }

    .link-card.featured .link-icon {
      background: var(--gold-dim);
      border-color: var(--gold-border);
    }

    .link-card:hover .link-icon {
      background: var(--gold-dim);
      border-color: var(--gold-border);
    }

    .link-text { flex: 1; min-width: 0; }

    .link-title {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      color: var(--w100);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .link-sub {
      font-size: 12px;
      color: var(--w40);
      line-height: 1.4;
    }

    .link-arrow {
      font-size: 13px;
      color: var(--w20);
      flex-shrink: 0;
      transition: color 0.22s, transform 0.22s;
    }

    .link-card:hover .link-arrow {
      color: var(--gold);
      transform: translateX(3px);
    }

    .divider-label {
      font-size: 11px;
      color: var(--w20);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-family: var(--sans);
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .socials {
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }

    .soc {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 0.5px solid var(--w10);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .soc:hover {
      background: var(--gold-dim);
      border-color: var(--gold-border);
      text-decoration: none;
    }

    .soc svg {
      width: 15px;
      height: 15px;
      fill: var(--w40);
      transition: fill 0.2s;
    }

    .soc:hover svg { fill: var(--gold); }

    .foot {
      font-size: 11px;
      color: var(--w20);
      text-align: center;
      letter-spacing: 0.04em;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.12s; }
    .d3 { animation-delay: 0.19s; }
    .d4 { animation-delay: 0.26s; }
    .d5 { animation-delay: 0.33s; }
    .d6 { animation-delay: 0.40s; }
    .d7 { animation-delay: 0.47s; }
    .d8 { animation-delay: 0.54s; }

    @media (max-width: 480px) {
      body { padding: 36px 16px 64px; }
      .name { font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="wrap">

  <div class="avatar-ring fade-up d1">

      <img src="/foto.jpg" alt="Jakub Vyhnalik" />

  </div>

  <h1 class="name fade-up d2">Jakub Vyhnalík</h1>

  <div class="links">

</div>

</body>
</html>
